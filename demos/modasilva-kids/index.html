<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modasilva Kids — Toptan Çocuk Giyim</title>
<meta name="description" content="Modasilva Kids — Merter, İstanbul. Toptan çocuk giyim kataloğu. Wholesale kids clothing catalog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf5; --surface:#ffffff; --ink:#2b2340; --muted:#6f6886; --line:#efe6dc;
  --brand:#ff6f61; --brand-ink:#ffffff; --brand-soft:#ffe3df;
  --accent:#3bb3a8; --accent-soft:#dff4f1; --sun:#ffc94d;
  --wa:#25d366; --shadow:0 6px 24px rgba(43,35,64,.08);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726; --surface:#251f33; --ink:#f4eff9; --muted:#b5abc6; --line:#3a3150;
    --brand-soft:#4a2a33; --accent-soft:#1f3d3b; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726; --surface:#251f33; --ink:#f4eff9; --muted:#b5abc6; --line:#3a3150;
  --brand-soft:#4a2a33; --accent-soft:#1f3d3b; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
html[dir="rtl"] body{font-family:"Noto Kufi Arabic","Nunito",system-ui,sans-serif}
a{color:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* demo ribbon */
.ribbon{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:7px 16px}
.ribbon b{color:var(--sun)}

/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:18px}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.links{display:flex;gap:22px;margin-inline-start:auto}
.links a{text-decoration:none;font-weight:700;color:var(--muted);font-size:15px}
.links a:hover{color:var(--brand)}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--brand);color:#fff}
.cart-btn{position:relative;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.cart-btn .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#fff;color:var(--accent);font-size:12px;margin-inline-start:6px;padding:0 5px}

/* hero */
.hero{padding:56px 0 36px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:16px 0 14px;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--brand)}
html[dir="rtl"] h1{letter-spacing:0;line-height:1.35}
.lead{font-size:18px;color:var(--muted);max-width:540px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;font:inherit;font-weight:800;font-size:16px;padding:14px 22px;border-radius:14px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(255,111,97,.35)}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:34px}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{color:var(--muted);font-size:14px}
.hero-art{position:relative;aspect-ratio:1/1;border-radius:32px;background:var(--brand-soft);overflow:hidden}
.hero-art .blob{position:absolute;border-radius:50%}
.hero-art .card{position:absolute;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px}
.hero-art .card svg{width:100%;height:auto}
.badge-float{position:absolute;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}

/* trust strip */
.strip{background:var(--surface);border-block:1px solid var(--line);padding:18px 0}
.strip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.strip-item{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px}
.strip-item i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:20px;flex:none}

/* sections */
section{padding:64px 0;scroll-margin-top:70px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}
h2{font-size:clamp(26px,3.4vw,36px);margin:0;letter-spacing:-.5px}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* products */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.prod-img{position:relative;aspect-ratio:4/5;display:grid;place-items:center;cursor:pointer}
.prod-img svg{width:72%}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--surface);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.tag.new{background:var(--sun);color:#2b2340}
.prod-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.code{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.prod h3{margin:0;font-size:17px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:8px}
.swatches{display:flex;gap:6px}
.swatches i{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.prod-foot{margin-top:auto;display:flex;gap:8px;padding-top:6px}
.prod-foot button{flex:1;border:0;font:inherit;font-weight:800;font-size:14px;padding:10px;border-radius:12px;cursor:pointer}
.add{background:var(--brand-soft);color:var(--brand)}
.add.in{background:var(--accent);color:#fff}
.det{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}

/* series explainer */
.series{background:var(--accent-soft)}
.series-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.size-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.size-table th,.size-table td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);font-size:15px}
.size-table th{background:var(--ink);color:var(--bg);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.size-table tr:last-child td{border-bottom:0}
.series-boxes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.series-boxes div{background:var(--surface);border-radius:14px;padding:12px 16px;text-align:center;box-shadow:var(--shadow);min-width:70px}
.series-boxes b{display:block;font-size:20px}
.series-boxes span{font-size:12px;color:var(--muted);font-weight:700}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}

/* quote form */
.quote-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px}
.empty{color:var(--muted);font-size:15px;padding:18px;border:2px dashed var(--line);border-radius:14px;text-align:center}
.qitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qthumb{width:52px;height:60px;border-radius:10px;display:grid;place-items:center;flex:none}
.qthumb svg{width:80%}
.qinfo{flex:1;min-width:0}
.qinfo b{display:block;font-size:14px}
.qinfo small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:800}
.qty small{color:var(--muted);font-size:11px}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
label.full{grid-column:1/-1}
input,select,textarea{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.form-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.hint{grid-column:1/-1;color:var(--muted);font-size:13px;margin:0}
.ok{grid-column:1/-1;background:var(--accent-soft);color:var(--accent);font-weight:800;padding:12px 14px;border-radius:12px;display:none}

/* about / contact */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.info-list{display:grid;gap:14px;margin-top:16px}
.info-list div{display:flex;gap:12px;align-items:flex-start}
.info-list i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;flex:none}
.info-list b{display:block}
.info-list span{color:var(--muted);font-size:15px}
.map{border-radius:24px;overflow:hidden;min-height:300px;background:
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,var(--surface);
  border:1px solid var(--line);position:relative;display:grid;place-items:center}
.map .pin{background:var(--brand);color:#fff;font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow)}
.map .pin:after{content:"";display:block;width:14px;height:14px;background:var(--brand);transform:rotate(45deg);margin:4px auto -17px}

footer{border-top:1px solid var(--line);padding:28px 0 90px;color:var(--muted);font-size:14px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

/* WhatsApp float */
.wa-float{position:fixed;bottom:20px;inset-inline-end:20px;z-index:40;display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;padding:14px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(37,211,102,.45)}
.wa-float svg{width:24px;height:24px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,15,30,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:26px;max-width:860px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.modal-img{display:grid;place-items:center;min-height:320px}
.modal-img svg{width:70%}
.modal-body{padding:28px;display:grid;gap:12px;align-content:start}
.modal-body h3{margin:0;font-size:24px}
.x{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;z-index:2}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec td{padding:8px 0;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--muted);font-weight:700;width:45%}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .links{display:none}
  .hero-grid,.series-grid,.quote-grid,.about-grid{grid-template-columns:1fr}
  .hero-art{max-width:460px;width:100%;margin:0 auto}
  .strip-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .nav{gap:8px;height:auto;padding:10px 0;flex-wrap:wrap}
  .langs{order:3;width:100%;justify-content:space-between}
  .langs button{flex:1}
  .cart-btn{margin-inline-start:auto}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .prod-body{padding:12px}
  .prod h3{font-size:15px}
  .prod-foot{flex-direction:column}
  form{grid-template-columns:1fr}
  .modal-box{grid-template-columns:1fr}
  .modal-img{min-height:220px}
  .wa-float span{display:none}
  .wa-float{padding:16px}
  .hero{padding-top:32px}
  section{padding:48px 0;scroll-margin-top:120px}
  .size-table th,.size-table td{padding:10px 8px;font-size:13px}
}
</style>
</head>
<body>

<div class="ribbon" data-i18n="ribbon"></div>

<header>
  <div class="wrap nav">
    <a class="logo" href="#top">
      <span class="logo-mark">✿</span>
      <span>Modasilva Kids<small data-i18n="logoSub"></small></span>
    </a>
    <nav class="links">
      <a href="#catalog" data-i18n="navCatalog"></a>
      <a href="#series" data-i18n="navSeries"></a>
      <a href="#quote" data-i18n="navQuote"></a>
      <a href="#contact" data-i18n="navContact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
      <button data-lang="ru">RU</button>
      <button data-lang="ar">AR</button>
    </div>
    <button class="cart-btn" onclick="location.hash='quote'"><span data-i18n="cartBtn"></span><span class="n" id="cartN">0</span></button>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="pill">📍 <span data-i18n="heroPill"></span></span>
        <h1 data-i18n-html="heroTitle"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="cta">
          <a class="btn btn-primary" href="#catalog" data-i18n="heroCta1"></a>
          <a class="btn btn-wa wa-link" target="_blank" rel="noopener"><span>💬</span><span data-i18n="heroCta2"></span></a>
        </div>
        <div class="stats">
          <div class="stat"><b>1–12</b><span data-i18n="statAge"></span></div>
          <div class="stat"><b data-i18n="statSeriesVal"></b><span data-i18n="statSeries"></span></div>
          <div class="stat"><b>🌍</b><span data-i18n="statShip"></span></div>
        </div>
      </div>
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
    </div>
  </div>

  <div class="strip">
    <div class="wrap strip-grid">
      <div class="strip-item"><i>🏭</i><span data-i18n="trust1"></span></div>
      <div class="strip-item"><i>📦</i><span data-i18n="trust2"></span></div>
      <div class="strip-item"><i>🚚</i><span data-i18n="trust3"></span></div>
      <div class="strip-item"><i>💬</i><span data-i18n="trust4"></span></div>
    </div>
  </div>

  <!-- CATALOG -->
  <section id="catalog">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <h2 data-i18n="catTitle"></h2>
          <p data-i18n="catSub"></p>
        </div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- SERIES -->
  <section id="series" class="series">
    <div class="wrap series-grid">
      <div>
        <h2 data-i18n="serTitle"></h2>
        <p class="lead" data-i18n="serLead"></p>
        <div class="series-boxes">
          <div><b>2</b><span data-i18n="ageY"></span></div>
          <div><b>3</b><span data-i18n="ageY"></span></div>
          <div><b>4</b><span data-i18n="ageY"></span></div>
          <div><b>5</b><span data-i18n="ageY"></span></div>
        </div>
        <ul class="steps">
          <li><b>1</b><span data-i18n="step1"></span></li>
          <li><b>2</b><span data-i18n="step2"></span></li>
          <li><b>3</b><span data-i18n="step3"></span></li>
        </ul>
      </div>
      <table class="size-table">
        <thead><tr><th data-i18n="thGroup"></th><th data-i18n="thSizes"></th><th data-i18n="thPack"></th></tr></thead>
        <tbody>
          <tr><td data-i18n="grpBaby"></td><td>6-9 / 9-12 / 12-18 / 18-24 <span data-i18n="monthShort"></span></td><td data-i18n="pack4"></td></tr>
          <tr><td data-i18n="grpSmall"></td><td>2 / 3 / 4 / 5 <span data-i18n="yearShort"></span></td><td data-i18n="pack4"></td></tr>
          <tr><td data-i18n="grpMid"></td><td>6 / 7 / 8 / 9 <span data-i18n="yearShort"></span></td><td data-i18n="pack4"></td></tr>
          <tr><td data-i18n="grpBig"></td><td>9 / 10 / 11 / 12 <span data-i18n="yearShort"></span></td><td data-i18n="pack4"></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- QUOTE -->
  <section id="quote">
    <div class="wrap">
      <div class="sec-head"><div><h2 data-i18n="qTitle"></h2><p data-i18n="qSub"></p></div></div>
      <div class="quote-grid">
        <div class="panel">
          <h3 data-i18n="qList"></h3>
          <div id="qlist"></div>
        </div>
        <div class="panel">
          <form id="qform" novalidate>
            <label><span data-i18n="fName"></span><input name="name" required autocomplete="name"></label>
            <label><span data-i18n="fCompany"></span><input name="company" autocomplete="organization"></label>
            <label><span data-i18n="fCountry"></span>
              <select name="country" id="countrySel"></select>
            </label>
            <label><span data-i18n="fPhone"></span><input name="phone" type="tel" required autocomplete="tel" placeholder="+90 5xx xxx xx xx"></label>
            <label class="full"><span data-i18n="fNote"></span><textarea name="note"></textarea></label>
            <p class="hint" data-i18n="fHint"></p>
            <div class="form-actions">
              <button class="btn btn-wa" type="submit"><span>💬</span><span data-i18n="fSendWa"></span></button>
              <button class="btn btn-ghost" type="button" id="sendForm" data-i18n="fSend"></button>
            </div>
            <div class="ok" id="okMsg" data-i18n="fOk"></div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" style="padding-top:0">
    <div class="wrap about-grid">
      <div class="panel">
        <h2 data-i18n="abTitle"></h2>
        <p style="color:var(--muted)" data-i18n="abText"></p>
        <div class="info-list">
          <div><i>📍</i><p style="margin:0"><b data-i18n="cAddr"></b><span>Merter, Güngören / İstanbul</span></p></div>

const COLOR_NAMES = {tr:"renk",en:"colors",ru:"цв.",ar:"ألوان"};

/* ======== SVG GARMENT ILLUSTRATIONS ======== */
function garment(shape, col, accent){
  const s = 'stroke="rgba(43,35,64,.18)" stroke-width="2" stroke-linejoin="round"';
  const dots = `<g fill="${accent}" opacity=".9"><circle cx="80" cy="120" r="5"/><circle cx="110" cy="140" r="5"/><circle cx="125" cy="110" r="5"/><circle cx="95" cy="165" r="5"/><circle cx="70" cy="160" r="4"/><circle cx="130" cy="170" r="4"/></g>`;
  const map = {
    dress:`<path d="M75 30 Q100 45 125 30 L135 60 L125 80 L165 190 Q100 205 35 190 L75 80 L65 60Z" fill="${col}" ${s}/><path d="M75 80 Q100 92 125 80" fill="none" stroke="${accent}" stroke-width="6"/>${dots}`,
    tee:`<path d="M70 35 Q100 52 130 35 L175 60 L160 95 L140 85 L140 185 L60 185 L60 85 L40 95 L25 60Z" fill="${col}" ${s}/><circle cx="100" cy="115" r="26" fill="${accent}" opacity=".9"/><path d="M88 112 l8 8 l16 -16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`,
    hoodie:`<path d="M72 40 Q100 10 128 40 L175 62 L170 160 L148 160 L145 95 L145 185 L55 185 L55 95 L52 160 L30 160 L25 62Z" fill="${col}" ${s}/><path d="M78 40 Q100 70 122 40" fill="none" stroke="rgba(43,35,64,.25)" stroke-width="3"/><rect x="72" y="135" width="56" height="30" rx="8" fill="${accent}" opacity=".85"/><path d="M92 55 v26 M108 55 v26" stroke="#fff" stroke-width="3"/>`,
    set:`<path d="M65 22 Q100 36 135 22 L168 42 L156 70 L140 64 L140 110 L60 110 L60 64 L44 70 L32 42Z" fill="${col}" ${s}/><path d="M62 114 L138 114 L144 192 L108 192 L100 140 L92 192 L56 192Z" fill="${accent}" ${s}/><path d="M60 98 H140" stroke="${accent}" stroke-width="6"/>`,
    romper:`<path d="M72 30 Q100 46 128 30 L160 50 L148 76 L138 72 L142 140 L130 188 L106 188 L100 160 L94 188 L70 188 L58 140 L62 72 L52 76 L40 50Z" fill="${col}" ${s}/><circle cx="100" cy="105" r="20" fill="#c99868"/><circle cx="86" cy="88" r="8" fill="#c99868"/><circle cx="114" cy="88" r="8" fill="#c99868"/><circle cx="93" cy="103" r="2.5" fill="#2b2340"/><circle cx="107" cy="103" r="2.5" fill="#2b2340"/><ellipse cx="100" cy="112" rx="5" ry="3.5" fill="#2b2340"/>`,
    jacket:`<path d="M70 30 Q100 18 130 30 L172 55 L168 170 L146 170 L144 100 L144 190 L56 190 L56 100 L54 170 L32 170 L28 55Z" fill="${col}" ${s}/><path d="M100 32 V190" stroke="${accent}" stroke-width="4"/><path d="M56 75 H144 M56 110 H144 M56 145 H144" stroke="rgba(255,255,255,.25)" stroke-width="3"/><rect x="66" y="120" width="22" height="6" rx="3" fill="${accent}"/><rect x="112" y="120" width="22" height="6" rx="3" fill="${accent}"/>`
  };
  return `<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" role="img">${map[shape]}</svg>`;
}

/* ======== STATE ======== */
let lang = "tr", filter = "all";
let cart = {};
try { cart = JSON.parse(localStorage.getItem("msk_cart")||"{}") || {}; } catch(e){}
try { const l = localStorage.getItem("msk_lang"); if (T[l]) lang = l; } catch(e){}
const urlLang = new URLSearchParams(location.search).get("lang"); if (T[urlLang]) lang = urlLang;
const saveCart = () => { try { localStorage.setItem("msk_cart", JSON.stringify(cart)); } catch(e){} };
const t = k => T[lang][k];
const waUrl = msg => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
const byId = id => P.find(p => p.id === id);

function applyLang(){
  const rtl = lang === "ar";
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.dataset.i18n);
    if (/<b>|<em>/.test(v)) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.querySelectorAll(".wa-link").forEach(a => a.href = waUrl(t("waHello")));
  const sel = document.getElementById("countrySel"), prev = sel.selectedIndex;
  sel.innerHTML = t("countries").map(c => `<option>${c}</option>`).join("");
  sel.selectedIndex = prev > 0 ? prev : 0;
  renderFilters(); renderGrid(); renderCart();
  try { localStorage.setItem("msk_lang", lang); } catch(e){}
}

function renderFilters(){
  const f = [["all","fAll"],["baby","fBaby"],["girl","fGirl"],["boy","fBoy"],["set","fSet"]];
  document.getElementById("filters").innerHTML = f.map(([k,l]) =>
    `<button class="chip ${filter===k?"on":""}" data-f="${k}">${t(l)}</button>`).join("");
}

function sizeLabel(p){ return p.sizes + " " + (p.baby ? t("monthShort") : t("yearShort")); }

function renderGrid(){
  const list = P.filter(p => filter==="all" || (filter==="set" ? p.shape==="set" : p.cat===filter));
  document.getElementById("grid").innerHTML = list.map(p => `
    <article class="prod">
      <div class="prod-img" style="background:${p.bg}" data-open="${p.id}">
        ${p.tag ? `<span class="tag ${p.tag==="new"?"new":""}">${t(p.tag==="new"?"tagNew":"tagBest")}</span>` : ""}
        ${garment(p.shape, p.c[0], p.c[1])}
      </div>
      <div class="prod-body">
        <span class="code">${p.id}</span>
        <h3>${p.name[lang]}</h3>
        <div class="meta"><span>📏 ${sizeLabel(p)}</span><span>📦 ${t("pack4")}</span></div>
        <div class="swatches">${p.c.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
        <div class="prod-foot">
          <button class="add ${cart[p.id]?"in":""}" data-add="${p.id}">${cart[p.id]?t("added"):t("add")}</button>
          <button class="det" data-open="${p.id}">${t("details")}</button>
        </div>
      </div>
    </article>`).join("");
}

function renderCart(){
  const ids = Object.keys(cart).filter(byId);
  document.getElementById("cartN").textContent = ids.reduce((s,id)=>s+cart[id],0);
  const box = document.getElementById("qlist");
  if (!ids.length){ box.innerHTML = `<div class="empty">${t("qEmpty")}</div>`; return; }
  box.innerHTML = ids.map(id => { const p = byId(id); return `
    <div class="qitem">
      <div class="qthumb" style="background:${p.bg}">${garment(p.shape,p.c[0],p.c[1])}</div>
      <div class="qinfo"><b>${p.name[lang]}</b><small>${p.id} · ${sizeLabel(p)}</small></div>
      <div class="qty"><button data-dec="${id}" aria-label="-">−</button><span>${cart[id]}</span><button data-inc="${id}" aria-label="+">+</button><small>${t("series")}</small></div>
      <button class="rm" data-rm="${id}" aria-label="remove">×</button>
    </div>`; }).join("");
}

function openModal(id){
  const p = byId(id);
  document.getElementById("mImg").style.background = p.bg;
  document.getElementById("mImg").innerHTML = garment(p.shape,p.c[0],p.c[1]);
  document.getElementById("mBody").innerHTML = `
    <span class="code">${p.id}</span>
    <h3>${p.name[lang]}</h3>
    <table class="spec">
      <tr><td>${t("sizes")}</td><td>${sizeLabel(p)}</td></tr>
      <tr><td>${t("series")}</td><td>${t("pack4")}</td></tr>
      <tr><td>${t("fabric")}</td><td>${p.fabric[lang]}</td></tr>
      <tr><td>${t("colors")}</td><td><div class="swatches">${p.c.map(c=>`<i style="background:${c}"></i>`).join("")}</div></td></tr>
      <tr><td>${t("minOrder")}</td><td>${t("series1")}</td></tr>
    </table>
    <b>${t("priceOnReq")}</b>
    <button class="btn btn-primary" data-add="${p.id}">${cart[p.id]?t("added"):t("add")}</button>
    <a class="btn btn-wa" target="_blank" rel="noopener" href="${waUrl(t("waProduct")+"\n"+p.id+" – "+p.name[lang]+" ("+sizeLabel(p)+")")}">💬 WhatsApp</a>`;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

function toast(msg){
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("show"), 1800);
}

function heroArt(){
  const picks = [P[0],P[1],P[2]];
  const pos = [["8%","10%","46%"],["48%","26%","44%"],["16%","54%","40%"]];
  document.getElementById("heroArt").innerHTML =
    `<div class="blob" style="width:60%;height:60%;background:var(--sun);opacity:.35;top:-10%;right:-10%"></div>
     <div class="blob" style="width:50%;height:50%;background:var(--accent);opacity:.25;bottom:-12%;left:-8%"></div>` +
    picks.map((p,i)=>`<div class="card" style="left:${pos[i][0]};top:${pos[i][1]};width:${pos[i][2]};background:${p.bg}">${garment(p.shape,p.c[0],p.c[1])}</div>`).join("") +
    `<div class="badge-float" style="right:6%;bottom:8%">⭐ <span data-i18n="tagNew">${t("tagNew")}</span> 2026</div>`;
}

/* ======== EVENTS ======== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang],[data-f],[data-add],[data-open],[data-inc],[data-dec],[data-rm]");
  if (!b) { if (e.target.id === "modal") closeModal(); return; }
  const d = b.dataset;
  if (d.lang){ lang = d.lang; applyLang(); heroArt(); }
  else if (d.f){ filter = d.f; renderFilters(); renderGrid(); }
  else if (d.add){
    if (cart[d.add]) delete cart[d.add]; else { cart[d.add] = 1; toast(t("toastAdd")); }
    saveCart(); renderGrid(); renderCart();
    if (document.getElementById("modal").classList.contains("open")) openModal(d.add);
  }
  else if (d.open){ openModal(d.open); }
  else if (d.inc){ cart[d.inc]++; saveCart(); renderCart(); }
  else if (d.dec){ cart[d.dec] = Math.max(1, cart[d.dec]-1); saveCart(); renderCart(); }
  else if (d.rm){ delete cart[d.rm]; saveCart(); renderCart(); renderGrid(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function buildMessage(f){
  const ids = Object.keys(cart).filter(byId);
  let m = (ids.length ? t("waQuote") : t("waHello")) + "\n\n";
  ids.forEach(id => { const p = byId(id); m += `• ${p.id} – ${p.name[lang]} (${sizeLabel(p)}) × ${cart[id]} ${t("series")}\n`; });
  m += `\n${t("wName")}: ${f.name.value}\n`;
  if (f.company.value) m += `${t("wCompany")}: ${f.company.value}\n`;
  m += `${t("wCountry")}: ${f.country.value}\n${t("wPhone")}: ${f.phone.value}\n`;
  if (f.note.value) m += `${t("wNote")}: ${f.note.value}\n`;
  return m;
}
function valid(f){
  if (!f.name.value.trim() || !f.phone.value.trim()){ toast(t("fErr")); return false; }
  return true;
}
const form = document.getElementById("qform");
form.addEventListener("submit", e => {
  e.preventDefault();
  if (!valid(form)) return;
  window.open(waUrl(buildMessage(form)), "_blank", "noopener");
});
document.getElementById("sendForm").addEventListener("click", () => {
  if (!valid(form)) return;
  document.getElementById("okMsg").style.display = "block";
  form.reset(); cart = {}; saveCart(); renderCart(); renderGrid();
});

applyLang(); heroArt();
</script>
</body>
</html>
